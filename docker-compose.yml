version: '3.8'

services:
  workbench:
    build:
      context: .
      dockerfile: Dockerfile
    image: omena-agent-workbench:latest
    container_name: omena-agent-workbench
    restart: unless-stopped
    shm_size: '2gb'
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - HOST=0.0.0.0
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-omena2026}
      - LOCAL_AI_URL=${LOCAL_AI_URL:-http://host.docker.internal:11434/v1}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
      - WORKSPACE_ROOT=/app/workspace
      - DATABASE_PATH=/app/storage/workbench.db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./workspace:/app/workspace
      - ./storage:/app/storage
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2048M
        reservations:
          cpus: '0.50'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
